aid: kikoff
name: Kikoff
description: 'Kikoff is a San Francisco-based consumer fintech, founded in 2019, that helps
  people build and repair credit. Its products include a Credit Account that furnishes tradelines
  to all three bureaus (Equifax, Experian, TransUnion), rent and bill reporting, credit
  monitoring and disputes, an AI Debt Negotiator, the Fynn AI credit coach, and an invite-only
  secured credit card, sold across Basic, Premium, and Ultimate subscription tiers. Kikoff
  Enterprise exposes a unified REST API covering member enrollment, tradeline furnishing, and
  dispute status so businesses can embed credit-building infrastructure. Backed by GGV Capital
  and Lightspeed Venture Partners.'
